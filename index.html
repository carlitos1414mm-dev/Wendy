<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzas de Wendy</title>
  <meta name="description" content="Control de dinero en pesos (MXN) y dólares (USD), sin internet.">
  <meta name="theme-color" content="#F6F7F9">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    /* Aplica el tema antes de pintar para evitar parpadeo */
    (function () {
      try {
        var t = localStorage.getItem('wendy-finanzas:tema');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#121212' : '#F6F7F9');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Finanzas de Wendy</p>
        <h1 id="titulo">Saldo</h1>
      </div>
      <button id="btnTema" class="icon-btn" type="button" aria-label="Cambiar tema"></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Secciones">
    <div id="tabbar" class="tabbar-in"></div>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">Esta app necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script src="js/app.js"></script>
</body>
</html>
